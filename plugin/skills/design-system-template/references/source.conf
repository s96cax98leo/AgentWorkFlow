# 設計正本設定（check-tokens.py、verify-tokens.py 讀這個檔）
# SOURCE：正本檔名（放在本 references/ 目錄）。沒有 HTML 正本時留空，白名單只用 tokens.css＋allowlist.txt。
SOURCE=
# ALLOW_RANGES：正本裡「設計系統本體」的行段，這些行出現的色值都算白名單（逗號分隔，例：12-381,523,546）。
# 留空＝不從正本取白名單。
ALLOW_RANGES=
# TOKEN_RANGE：tokens.css 第 1 部分逐字擷取自正本的行段（例：16-87）。verify-tokens.py 會比對整段相同。
TOKEN_RANGE=
