# AgentWorkFlow 模版本身的 CI：在三個作業系統跑 tests/run_all.py
# （去客戶化掃描、init 煙霧測試含 golden-set／build.py --check／check_workflows.mjs／check_agents.py、
# hook 測試、tests/check_*.py，例如供應鏈檢查 check_supply.py）。
# Windows 用 pwsh 執行，確認不依賴 bash。
# 主矩陣用 Python 3.12；另在 ubuntu 跑支援範圍的兩端 3.9 與 3.13。
# 所有 action 都釘 40 字元 commit SHA，註解保留對應的版本標籤；由 .github/dependabot.yml 每週提更新。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # ubuntu-latest（26.04 起）沒有 3.9 的預建版本，支援下限改在 22.04 跑
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: 保留 LF 換行（Windows 預設 autocrlf 會把 checkout 的檔案改成 CRLF）
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # pip 會依 Python 版本挑相容的 jsonschema（3.9 也有支援的版本），不用分開處理。
      - name: 安裝 golden-set 需要的 jsonschema
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: git 身分（hook 測試會建暫存 repo）
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main

      - name: 全部測試（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/run_all.py

      - name: 全部測試（Windows，pwsh）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: python tests/run_all.py
