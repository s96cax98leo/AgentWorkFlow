[package]
name = "awf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
regex.workspace = true
fancy-regex.workspace = true
unicode-normalization.workspace = true
rusqlite.workspace = true
tree-sitter = "0.26.13"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-rust = "0.24.2"
ignore = "0.4.30"
tree-sitter-php = "0.25.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }

[features]
# 選用的語言：預設不放（執行檔會超過 15MB 的目標）。要用時 cargo build --features lang-csharp,lang-kotlin
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
